name: Verify Generated Assets

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - ".github/workflows/assets.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-assets.mjs"
      - "site/assets/queup-logo.svg"
      - "extension/icons/**"
      - "site/assets/icon-*.png"
      - "store-assets/queup-store-icon-128.png"
      - "store-assets/queup-google-auth-logo-120.png"
      - "store-assets/queup-youtube-channel.svg"
      - "store-assets/queup-youtube-channel-2048x1152.png"
  pull_request:
    paths:
      - "assets/**"
      - ".github/workflows/assets.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-assets.mjs"
      - "site/assets/queup-logo.svg"
      - "extension/icons/**"
      - "site/assets/icon-*.png"
      - "store-assets/queup-store-icon-128.png"
      - "store-assets/queup-google-auth-logo-120.png"
      - "store-assets/queup-youtube-channel.svg"
      - "store-assets/queup-youtube-channel-2048x1152.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-bitmaps:
    name: Generated bitmap assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate and verify PNG assets
        run: npm run assets:check
