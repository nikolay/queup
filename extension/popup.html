<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueUp</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>QueUp</h1>
      <p class="subhead">Queue YouTube videos in your private <strong>Que</strong> playlist.</p>
      <button id="connectYoutube">Connect YouTube</button>
      <button id="openQueue" class="secondary">Open Que Playlist</button>
      <button id="refreshQueue" class="secondary">Refresh Queue Cache</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
