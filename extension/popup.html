<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueUp</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <div class="popup-brand">
        <img src="icons/icon-48.png" width="32" height="32" alt="" />
        <h1>QueUp</h1>
      </div>
      <p class="subhead">Queue YouTube videos in your private <strong>Que</strong> playlist.</p>
      <p id="connection" class="connection" aria-live="polite">Checking YouTube connection...</p>
      <button id="connectYoutube">Connect YouTube</button>
      <button id="disconnectYoutube" class="secondary" hidden>Disconnect</button>
      <button id="openQueue" class="secondary">Open Que</button>
      <button id="refreshQueue" class="secondary">Refresh Que Cache</button>
      <p id="status" aria-live="polite"></p>
      <p id="lastError" class="detail" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
