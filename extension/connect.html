<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect QueUp to YouTube</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <main class="connect-card">
      <p class="eyebrow">QueUp setup</p>
      <h1>Connect YouTube</h1>
      <p>
        QueUp needs permission to create and update your private <strong>Que</strong> playlist in your YouTube account.
      </p>
      <button id="connectButton">Connect YouTube</button>
      <button id="openYouTubeButton" class="secondary">Open YouTube</button>
      <p id="status" aria-live="polite">Click Connect YouTube to open Google's consent prompt.</p>
      <pre id="details" aria-live="polite"></pre>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
