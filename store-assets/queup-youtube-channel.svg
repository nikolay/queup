<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-labelledby="title desc">
  <title id="title">QueUp YouTube Channel Image</title>
  <desc id="desc">A red and cream QueUp channel image showing the logo, YouTube queue message, and compact Que buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="0.54" stop-color="#ffe8df"/>
      <stop offset="1" stop-color="#fff7ef"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#291010"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#5c0e0e" flood-opacity="0.16"/>
    </filter>
    <filter id="buttonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#ff0000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1024" height="576" fill="url(#bg)"/>
  <circle cx="40" cy="86" r="210" fill="#ff0000" opacity="0.13"/>
  <circle cx="940" cy="18" r="215" fill="#ffc663" opacity="0.31"/>
  <circle cx="850" cy="520" r="230" fill="#ff0000" opacity="0.09"/>
  <path d="M74 44 L150 44 L260 532 L184 532 Z" fill="#ff0000" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <rect x="54" y="54" width="916" height="468" rx="42" fill="#ffffff" opacity="0.76"/>
    <rect x="54.5" y="54.5" width="915" height="467" rx="41.5" fill="none" stroke="#181111" stroke-opacity="0.1"/>
  </g>

  <g transform="translate(100 104)">
    <rect x="0" y="0" width="86" height="86" rx="22" fill="#ff0000"/>
    <circle cx="43" cy="43" r="27" fill="none" stroke="#ffffff" stroke-width="14"/>
    <line x1="58" y1="58" x2="75" y2="75" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M38 32 L38 54 L56 43 Z" fill="#ffffff"/>
  </g>

  <text x="206" y="158" fill="#171111" stroke="#171111" stroke-width="0.55" paint-order="stroke fill" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">QueUp</text>
  <text x="100" y="258" fill="#171111" stroke="#171111" stroke-width="0.9" paint-order="stroke fill" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-2.2">Queue YouTube</text>
  <text x="100" y="318" fill="#171111" stroke="#171111" stroke-width="0.9" paint-order="stroke fill" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="55" font-weight="700" letter-spacing="-2.2">without tab chaos.</text>
  <text x="102" y="368" fill="#4b3838" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="24" font-weight="400">Private playlist-powered watch queue.</text>

  <g transform="translate(100 410)">
    <g filter="url(#buttonShadow)">
      <rect x="0" y="0" width="118" height="46" rx="23" fill="#ffffff" stroke="#ff0000" stroke-opacity="0.14"/>
      <text x="24" y="30" fill="#ff0000" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="22" font-weight="700">+</text>
      <text x="52" y="30" fill="#171111" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Que</text>
    </g>
    <g transform="translate(136 0)" filter="url(#buttonShadow)">
      <rect x="0" y="0" width="118" height="46" rx="23" fill="#ffffff" stroke="#ff0000" stroke-opacity="0.14"/>
      <text x="28" y="30" fill="#ff0000" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="22" font-weight="700">-</text>
      <text x="52" y="30" fill="#171111" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="19" font-weight="700">Que</text>
    </g>
  </g>

  <g transform="translate(586 116)" filter="url(#softShadow)">
    <rect x="0" y="0" width="326" height="326" rx="34" fill="#fff8f4"/>
    <rect x="0.5" y="0.5" width="325" height="325" rx="33.5" fill="none" stroke="#181111" stroke-opacity="0.1"/>
    <rect x="32" y="34" width="262" height="158" rx="24" fill="url(#video)"/>
    <path d="M151 83 L151 143 L201 113 Z" fill="#ffffff"/>

    <g transform="translate(32 218)">
      <rect x="0" y="0" width="94" height="38" rx="19" fill="#f0efee"/>
      <circle cx="20" cy="19" r="11" fill="#ff0000"/>
      <text x="15" y="27" fill="#ffffff" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="20" font-weight="700">+</text>
      <text x="40" y="25" fill="#171111" font-family="Figtree, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Que</text>
    </g>

    <rect x="32" y="278" width="174" height="16" rx="8" fill="#ebe1dd"/>
    <rect x="218" y="278" width="76" height="16" rx="8" fill="#ebe1dd"/>
  </g>
</svg>
