<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QueUp Chrome Web Store Screenshot</title>
    <style>
      :root {
        --red: #ff0000;
        --red-dark: #b90000;
        --ink: #181111;
        --paper: #fff7ef;
        --cream: #ffe9d6;
        --soft-red: #ffd7d7;
        --line: rgba(24, 17, 17, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 800px;
        margin: 0;
        overflow: hidden;
        width: 1280px;
      }

      body {
        background:
          radial-gradient(circle at 6% 12%, rgba(255, 0, 0, 0.2), transparent 25%),
          radial-gradient(circle at 88% 18%, rgba(255, 213, 118, 0.36), transparent 28%),
          radial-gradient(circle at 80% 84%, rgba(255, 0, 0, 0.14), transparent 32%),
          linear-gradient(135deg, #fffaf4 0%, #ffe8df 48%, #fff7ef 100%);
        color: var(--ink);
        font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
        padding: 40px;
      }

      .frame {
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid var(--line);
        border-radius: 40px;
        box-shadow: 0 36px 90px rgba(97, 15, 15, 0.18);
        display: grid;
        gap: 36px;
        grid-template-columns: 0.94fr 1.26fr;
        height: 720px;
        padding: 42px;
        position: relative;
      }

      .frame::before {
        background: linear-gradient(180deg, rgba(255, 0, 0, 0.12), transparent);
        border-radius: 999px;
        content: "";
        height: 640px;
        left: 54px;
        position: absolute;
        top: 38px;
        transform: rotate(-18deg);
        width: 138px;
      }

      .copy,
      .browser {
        position: relative;
        z-index: 1;
      }

      .brand {
        align-items: center;
        display: flex;
        gap: 16px;
        margin-bottom: 44px;
      }

      .brand img {
        border-radius: 22px;
        box-shadow: 0 16px 34px rgba(255, 0, 0, 0.24);
        height: 78px;
        width: 78px;
      }

      .brand h1 {
        font-size: 48px;
        letter-spacing: -0.055em;
        line-height: 1;
        margin: 0;
      }

      .eyebrow {
        color: var(--red-dark);
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.13em;
        margin: 0 0 14px;
        text-transform: uppercase;
      }

      h2 {
        font-size: 68px;
        letter-spacing: -0.075em;
        line-height: 0.92;
        margin: 0 0 26px;
        max-width: 520px;
      }

      p {
        color: #453232;
        font-size: 24px;
        line-height: 1.36;
        margin: 0 0 26px;
        max-width: 520px;
      }

      .feature-row {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }

      .chip {
        align-items: center;
        background: #ffffff;
        border: 1px solid rgba(255, 0, 0, 0.16);
        border-radius: 999px;
        box-shadow: 0 14px 32px rgba(75, 16, 16, 0.09);
        display: inline-flex;
        font-size: 17px;
        font-weight: 900;
        gap: 8px;
        padding: 13px 17px;
      }

      .chip strong {
        color: var(--red);
        font-size: 22px;
        line-height: 1;
      }

      .browser {
        align-self: center;
        background: #ffffff;
        border: 1px solid rgba(24, 17, 17, 0.14);
        border-radius: 30px;
        box-shadow: 0 28px 60px rgba(24, 17, 17, 0.18);
        overflow: hidden;
      }

      .chrome {
        align-items: center;
        background: #f3f0ec;
        display: flex;
        gap: 8px;
        height: 56px;
        padding: 0 18px;
      }

      .dot {
        border-radius: 50%;
        height: 12px;
        width: 12px;
      }

      .dot:nth-child(1) { background: #ff6058; }
      .dot:nth-child(2) { background: #ffbd2e; }
      .dot:nth-child(3) { background: #28c840; }

      .url {
        background: #ffffff;
        border-radius: 999px;
        color: #756666;
        flex: 1;
        font-size: 14px;
        margin-left: 12px;
        padding: 10px 16px;
      }

      .youtube {
        background: linear-gradient(180deg, #fff, #fff9f5);
        display: grid;
        gap: 24px;
        grid-template-columns: 1.22fr 0.78fr;
        padding: 24px;
      }

      .video {
        background:
          linear-gradient(140deg, rgba(255, 0, 0, 0.86), rgba(20, 12, 12, 0.95)),
          radial-gradient(circle at 72% 22%, rgba(255, 255, 255, 0.3), transparent 18%);
        border-radius: 22px;
        height: 322px;
        position: relative;
      }

      .video::after {
        border-bottom: 38px solid transparent;
        border-left: 58px solid #ffffff;
        border-top: 38px solid transparent;
        content: "";
        left: 50%;
        opacity: 0.92;
        position: absolute;
        top: 50%;
        transform: translate(-42%, -50%);
      }

      .open-button {
        background: var(--red);
        border-radius: 999px;
        bottom: 24px;
        box-shadow: 0 14px 28px rgba(255, 0, 0, 0.34);
        color: #ffffff;
        font-size: 17px;
        font-weight: 950;
        padding: 15px 22px;
        position: absolute;
        right: 24px;
      }

      .actions {
        align-items: center;
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      .que-button {
        align-items: center;
        background: #f2f2f2;
        border: 0;
        border-radius: 999px;
        color: #171717;
        display: inline-flex;
        font-size: 16px;
        font-weight: 850;
        gap: 8px;
        padding: 12px 16px;
      }

      .que-button strong {
        background: var(--red);
        border-radius: 50%;
        color: #ffffff;
        display: inline-grid;
        height: 22px;
        place-items: center;
        width: 22px;
      }

      .title {
        background: #efe8e3;
        border-radius: 999px;
        height: 22px;
        margin-top: 18px;
        width: 76%;
      }

      .rec {
        align-items: start;
        display: grid;
        gap: 12px;
        grid-template-columns: 118px 1fr;
        margin-bottom: 18px;
      }

      .thumb {
        background: linear-gradient(135deg, var(--red), #221313);
        border-radius: 16px;
        height: 72px;
        position: relative;
      }

      .thumb::after {
        background: rgba(255, 255, 255, 0.84);
        clip-path: polygon(0 0, 0 100%, 100% 50%);
        content: "";
        height: 22px;
        left: 50%;
        position: absolute;
        top: 50%;
        transform: translate(-38%, -50%);
        width: 28px;
      }

      .line {
        background: #eee4df;
        border-radius: 999px;
        height: 12px;
        margin: 3px 0 10px;
      }

      .line.short {
        width: 66%;
      }

      .rec .que-button {
        font-size: 13px;
        gap: 6px;
        padding: 8px 11px;
      }

      .rec .que-button strong {
        height: 18px;
        width: 18px;
      }
    </style>
  </head>
  <body>
    <section class="frame">
      <div class="copy">
        <div class="brand">
          <img src="../site/assets/queup-logo.svg" alt="QueUp logo" />
          <h1>QueUp</h1>
        </div>
        <p class="eyebrow">YouTube Watch Queue</p>
        <h2>Queue videos without tab chaos.</h2>
        <p>Save videos from YouTube pages and recommendations to a private playlist named Que. Watched videos clean themselves up.</p>
        <div class="feature-row">
          <span class="chip"><strong>+</strong> Que</span>
          <span class="chip"><strong>-</strong> Que</span>
          <span class="chip">Open Que</span>
        </div>
      </div>

      <div class="browser">
        <div class="chrome">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="url">youtube.com/watch?v=...</span>
        </div>
        <div class="youtube">
          <div>
            <div class="video"><div class="open-button">Open Que</div></div>
            <div class="actions">
              <span class="que-button"><strong>+</strong> Que</span>
              <span class="que-button"><strong>-</strong> Que</span>
            </div>
            <div class="title"></div>
          </div>
          <aside>
            <div class="rec">
              <div class="thumb"></div>
              <div>
                <div class="line"></div>
                <div class="line short"></div>
                <span class="que-button"><strong>+</strong> Que</span>
              </div>
            </div>
            <div class="rec">
              <div class="thumb"></div>
              <div>
                <div class="line"></div>
                <div class="line short"></div>
                <span class="que-button"><strong>+</strong> Que</span>
              </div>
            </div>
            <div class="rec">
              <div class="thumb"></div>
              <div>
                <div class="line"></div>
                <div class="line short"></div>
                <span class="que-button"><strong>+</strong> Que</span>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </body>
</html>
